; ============================================================
; 游戏机项目 — STM32F103CBT6 (128K Flash)
; ============================================================
; 接线:
;   LCD数据: PB0-PB15 (PB2缺位→D2用PC13板载LED)
;   LCD控制: PA8(RS) PA9(WR) PA10(RD) PA11(CS) PA12(RST) PA15(BL)
;   触摸SPI: PA4(CLK) PA5(MISO) PA6(MOSI) PC14(CS) PA3(PEN)
;   摇杆:    PA0(VRx) PA1(VRy) PA2(SW)
;   蜂鸣器:  PA7
; ============================================================

[env:genericSTM32F103C8]

; ---- 平台和框架 ----
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube

; ---- 烧录和调试 ----
upload_protocol = stlink
debug_tool = stlink

; ---- 编译宏定义 ----
build_flags =
    -D HSE_VALUE=8000000
    -D STM32F103xB
    -D USE_HAL_DRIVER
    -D HAL_MODULE_ENABLED
    -D HAL_GPIO_MODULE_ENABLED
    -D HAL_RCC_MODULE_ENABLED
    -D HAL_CORTEX_MODULE_ENABLED
    -D HAL_ADC_MODULE_ENABLED
    -D HAL_TIM_MODULE_ENABLED
    -D HAL_DMA_MODULE_ENABLED
    -D HAL_FLASH_MODULE_ENABLED
    -D HAL_PWR_MODULE_ENABLED
